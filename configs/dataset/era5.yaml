# ERA5-Land Hourly Reanalysis Configuration
# Source: Copernicus Climate Data Store (ECMWF)
# Requires CDS_API_KEY environment variable

name: era5
data_dir: data
target_column: "T_2m (K)"

# ERA5 Variables
variables:
  - 2m_temperature
  - 2m_dewpoint_temperature
  - 10m_u_component_of_wind
  - 10m_v_component_of_wind
  - surface_pressure
  - total_precipitation

# Time range
years:
  - "2022"
  - "2023"
months: ["01","02","03","04","05","06","07","08","09","10","11","12"]

# Region (predefined: indonesia, java, global)
region: indonesia
# Or specify custom area: [N, W, S, E]
# area: [6.0, 95.0, -11.0, 141.0]

# Optional: extract single point
# latitude: -6.21
# longitude: 106.85

# Window configuration
input_window: 168
forecast_horizon: 24

# Split ratios (chronological)
train_ratio: 0.70
val_ratio: 0.15

# DataLoader settings
batch_size: 64
num_workers: 4
