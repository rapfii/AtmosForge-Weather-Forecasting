# Optuna HPO Search Space — LSTM (Template)
# Other models follow the same structure

model: lstm
n_trials: 50
max_epochs_per_trial: 30
patience_per_trial: 5

# Search space
search_space:
  hidden_size:
    type: categorical
    choices: [64, 128, 256]

  num_layers:
    type: int
    low: 1
    high: 4

  learning_rate:
    type: float
    low: 0.00001
    high: 0.01
    log: true

  dropout:
    type: float
    low: 0.0
    high: 0.5

  batch_size:
    type: categorical
    choices: [32, 64, 128]

# Optuna settings
sampler: tpe
pruner: median
pruner_n_startup_trials: 5
pruner_n_warmup_steps: 3
