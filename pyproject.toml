[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "atmosforge"
version = "0.1.0"
description = "Production-grade benchmarking framework for multivariate meteorological time-series forecasting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Raffi Khairan Hidayat"},
]
keywords = [
    "time-series",
    "forecasting",
    "weather",
    "deep-learning",
    "benchmarking",
    "mlops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "torch>=2.2",
    "pytorch-forecasting>=1.0",
    "pytorch-lightning>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.11",
    "optuna>=3.6",
    "shap>=0.45",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pandas>=2.0",
    "polars>=0.20",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "openmeteo-requests>=0.2",
    "requests-cache>=1.0",
    "retry-requests>=2.0",
    "cdsapi>=0.7",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "black>=24.0",
    "pre-commit>=3.6",
    "ipykernel>=6.29",
]

[project.urls]
Repository = "https://github.com/rapfii/AtmosForge-Weather-Forecasting"
Documentation = "https://github.com/rapfii/AtmosForge-Weather-Forecasting#readme"

[project.scripts]
atmosforge-train = "src.training.trainer:main"
atmosforge-serve = "src.serving.api:main"
atmosforge-benchmark = "scripts.run_benchmark:main"

# ─── Tool Configuration ─────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pytorch_forecasting.*",
    "pytorch_lightning.*",
    "mlflow.*",
    "optuna.*",
    "shap.*",
    "hydra.*",
    "omegaconf.*",
    "openmeteo_requests.*",
    "cdsapi.*",
    "sklearn.*",
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "requests_cache.*",
    "retry_requests.*",
    "rich.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
